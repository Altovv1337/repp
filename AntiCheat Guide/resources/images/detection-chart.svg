<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="380" fill="#0f1720" rx="12"/>
  <text x="400" y="35" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">Использование методов обнаружения (иллюстративно)</text>

  <g font-size="14" fill="#c9d6df">
    <text x="40" y="90">Server-side валидация</text>
    <rect x="280" y="72" width="440" height="24" rx="6" fill="#4fd1c5"/>
    <text x="730" y="90" fill="#ffffff" text-anchor="end">92%</text>

    <text x="40" y="140">Kernel-level драйвер</text>
    <rect x="280" y="122" width="360" height="24" rx="6" fill="#f6ad55"/>
    <text x="650" y="140" fill="#ffffff" text-anchor="end">76%</text>

    <text x="40" y="190">Сигнатурный анализ</text>
    <rect x="280" y="172" width="310" height="24" rx="6" fill="#fc8181"/>
    <text x="600" y="190" fill="#ffffff" text-anchor="end">66%</text>

    <text x="40" y="240">Поведенческая эвристика</text>
    <rect x="280" y="222" width="280" height="24" rx="6" fill="#b794f4"/>
    <text x="570" y="240" fill="#ffffff" text-anchor="end">58%</text>

    <text x="40" y="290">Машинное обучение</text>
    <rect x="280" y="272" width="210" height="24" rx="6" fill="#63b3ed"/>
    <text x="500" y="290" fill="#ffffff" text-anchor="end">44%</text>
  </g>

  <text x="40" y="350" font-size="12" fill="#7a8b96">* Данные приведены в учебных целях и не отражают реальную статистику конкретных вендоров.</text>
</svg>
